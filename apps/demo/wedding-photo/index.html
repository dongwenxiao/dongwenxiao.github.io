<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0,minimum-scale=1.0,maximum-scale=1.0,user-scalable=no,minimal-ui" />
    <title>婚礼照片</title>
    <meta name="format-detection" content="email=no" />
    <meta name="format-detection" content="address=no" />
    <meta name="format-detection" content="telephone=no" />
    <style type="text/css">
    body {
        background: #ece4d9;
        margin: 3px;
    }
    
    #imgBox img {
        /*display: none;*/
        width: 100%;
    }
    
    .poster {
        /*display: none;*/
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        top: 0;
        background: linear-gradient(to bottom, #ece4d9 0%, #e9dfd1 100%);
    }
    
    .title {
        font-family: "Arial Rounded MT Bold", "Helvetica Rounded", Arial, sans-serif;
        text-transform: uppercase;
        display: block;
        font-size: 50px;
        color: #f1ebe5;
        text-shadow: 0 8px 9px #c4b59d, 0px -2px 1px #fff;
        font-weight: bold;
        letter-spacing: -4px;
        text-align: center;
        position: absolute;
        padding: 100px 200px;
        top: 35%;
        left: 50%;
        -webkit-transform: translate(-50%, -50%);
    }
    
    .loading {
        font-family: "Arial Rounded MT Bold", "Helvetica Rounded", Arial, sans-serif;
        color: #C0B6AB;
        text-shadow: 0 6px 7px #C3BBB0, 0px -2px 1px #DAD7D7;
        position: fixed;
        bottom: 15%;
        left: 50%;
        margin-left: -50px;
        width: 100px;
        text-align: center;
        font-size: 16px;
        letter-spacing: 0px;
    }
    
    @-webkit-keyframes fadeOut {
        0% {
            opacity: 1
        }

        100% {
            opacity: 0
        }
    }

    @keyframes fadeOut {
        0% {
            opacity: 1
        }

        100% {
            opacity: 0
        }
    }

    .fadeOut {
        -webkit-animation-name: fadeOut;
        animation-name: fadeOut
    }
    .animated {
        -webkit-animation-duration: 1s;
        animation-duration: 1s;
        -webkit-animation-fill-mode: both;
        animation-fill-mode: both
    }
    </style>
</head>

<body>
    <div class="poster">
        <div class="title">Merry review</div>
        <div class="loading">0%</div>
    </div>
    <div id="imgBox">
    </div>
</body>

</html>
<script src="zepto.min.js"></script>
<script>
$(function() {
    var imgCount = 55;
	var imgLoadedCount = 0;
	var imgList = [];

	var isAllLoaded = false;
	var canDisplay = false;
	var stCanDisplay = setTimeout(function(){
		canDisplay = true;
		if(isAllLoaded) showPics();
		clearTimeout(stCanDisplay);
	},2000);

	for (var i = 1; i <= imgCount; i++) {
	    var src = "img/" + i + ".jpg";
	    imgList.push(src);
	}

	preload(imgList);


	function preload (imgList) {

		for (var i = 0; i <= imgList.length; i++) {
		    var src = imgList[i];
		    (function(src){
		    	var img = new Image();
		    	img.onload = function(){

		    		imgLoadedCount ++;		    		
		    		var rate = Math.round((imgLoadedCount / imgCount) * 100);
		    		updateLoadingText(rate, function(){
		    			isAllLoaded = true;
		    			if(canDisplay) showPics();
		    		});
		    	}
		    	img.src = src;
		    })(src);
		}
	}
	function showPics(){
		addImg(imgList);
		$(".poster").addClass('fadeOut animated');
	}
	function updateLoadingText(val, cb){
		console.log(val + "%")
		$(".loading").html(val + "%");
		if(val == 100){
			cb && cb();
		}
	}


	function addImg(imgList){
		for (var i = 0; i <= imgList.length; i++) {
		    var src = imgList[i];
		    $("<img>").attr("src", src).appendTo(imgBox);
		}
	}

});
</script>
